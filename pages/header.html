                    <img src="images/logo.png" alt="Logo Chùa Vĩnh Hưng" onerror="this.src='https://placehold.co/100x100/e11d48/ffffff?text=VH'">

                <span class="logo-text text-2xl font-heading font-bold tracking-wider transition-colors duration-300" style="margin-left: 5mm;">
                    CHÙA VĨNH HƯNG
                </span>
            </div>
            
            <!-- Desktop Menu (Động từ Firebase) -->
            <nav id="desktop-menu-nav" class="hidden md:flex space-x-8">
                <a href="index.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-amber-300 transition-colors">Trang Chủ</a>
                <a href="gioi-thieu.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-amber-300 transition-colors">Giới Thiệu</a>
                <a href="tin-tuc.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-amber-300 transition-colors">Tin Tức & Khóa Tu</a>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-btn" class="text-gray-200 hover:text-white focus:outline-none p-2">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu (Động từ Firebase) -->
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-xl absolute w-full left-0 top-20 border-t border-gray-100 text-slate-800">
        <div id="mobile-menu-container" class="px-3 pt-2 pb-4 space-y-1">

            <a href="video.html" class="block px-3 py-2 text-base font-semibold text-slate-700 hover:bg-rose-50 rounded-xl">Giảng Pháp</a>
            <a href="lien-he.html" class="block px-3 py-2 text-base font-semibold text-slate-700 hover:bg-rose-50 rounded-xl">Liên Hệ</a>
        </div>
    </div>
</header>

<!-- Firebase Script & Dynamic Menu Loader for Public Header -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
    if (!firebase.apps.length) {
        firebase.initializeApp({
            databaseURL: "https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadDynamicMenus();
    });

    async function loadDynamicMenus() {
        try {
            const snapshot = await firebase.database().ref('menus').once('value');
            const menuData = snapshot.val();
            if (!menuData) return;

            const sortedKeys = Object.keys(menuData).sort((a, b) => (menuData[a].order || 0) - (menuData[b].order || 0));
            
            const desktopNav = document.getElementById('desktop-menu-nav');
            const mobileContainer = document.getElementById('mobile-menu-container');

            if (desktopNav && mobileContainer) {
                let desktopHtml = '';
                let mobileHtml = '';

                sortedKeys.forEach(key => {
                    const item = menuData[key];
                    const title = item.title || '';
                    const url = item.url || '#';

                    desktopHtml += `<a href="${url}" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-amber-300 transition-colors">${title}</a>`;
                    mobileHtml += `<a href="${url}" class="block px-3 py-2.5 text-base font-semibold text-slate-700 hover:bg-rose-50 hover:text-rose-700 rounded-xl transition">${title}</a>`;
                });

                desktopNav.innerHTML = desktopHtml;
                mobileContainer.innerHTML = mobileHtml;

                // Sau khi nội dung menu động đã được đổ xong vào DOM, gọi lại sự kiện Active để đánh dấu menu
                if (typeof setActiveNavLink === 'function') {
                    setActiveNavLink();
                }
            }
        } catch (err) {
            console.error("Lỗi tải menu động cho header:", err);
        }
    }
</script>
