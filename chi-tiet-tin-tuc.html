<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Chi tiết tin tức</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Khung nội dung bài viết -->
  <div id="post-detail" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <h1 id="post-title">Đang tải...</h1>
    <p id="post-date" style="color: #666; font-size: 14px;"></p>
    <hr>
    <div id="post-content" style="line-height: 1.8; font-size: 16px;"></div>
    
    <br>
    <a href="tin-tuc.html">← Quay lại danh sách tin tức</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://hambcvcvsyqwptdumywg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sagetYaLckRL6UovNa_4kA_5l9AF7Ak';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPostDetail() {
      // 1. Lấy ID bài viết từ URL (ví dụ: ?id=12)
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (!postId) {
        document.getElementById('post-title').innerText = 'Không tìm thấy bài viết!';
        return;
      }

      // 2. Tìm đúng bài viết có ID tương ứng trong Supabase
      let { data: post, error } = await supabaseClient
        .from('posts')
        .select('*')
        .eq('id', postId)
        .single();

      if (error || !post) {
        document.getElementById('post-title').innerText = 'Bài viết không tồn tại!';
        return;
      }

      // 3. Đổ dữ liệu vào trang HTML
      document.title = post.title; // Đổi tiêu đề tab trình duyệt
      document.getElementById('post-title').innerText = post.title;
      document.getElementById('post-date').innerText = 'Ngày đăng: ' + new Date(post.created_at).toLocaleDateString('vi-VN');
      document.getElementById('post-content').innerHTML = post.content;
    }

    loadPostDetail();
  </script>
</body>
</html>
