<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title id="page-title">Chi tiết tin tức</title>
</head>
<body>

  <div style="max-width: 800px; margin: 40px auto; padding: 20px;">
    <h1 id="tinTuc-title">Đang tải...</h1>
    <p id="tinTuc-date" style="color: #666; font-size: 14px;"></p>
    <hr>
    <div id="tinTuc-content" style="line-height: 1.8; font-size: 16px;"></div>
    
    <br><br>
    <a href="tin-tuc.html">← Quay lại danh sách tin tức</a>
  </div>

  <script>
    const SPACE_ID = 'YOUR_SPACE_ID';
    const ACCESS_TOKEN = 'YOUR_ACCESS_TOKEN';

    async function loadPostDetail() {
      // 1. Đọc slug từ URL (ví dụ: chi-tiet.html?slug=khoa-tu-mua-he)
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      if (!slug) {
        document.getElementById('tinTuc-title').innerText = 'Không tìm thấy bài viết!';
        return;
      }

      // 2. Gọi API lọc chính xác bài viết có slug tương ứng
      const url = `https://cdn.contentful.com/spaces/${SPACE_ID}/environments/master/entries?access_token=${ACCESS_TOKEN}&content_type=tinTuc&fields.slug=${slug}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          document.getElementById('tinTuc-title').innerText = 'Bài viết không tồn tại!';
          return;
        }

        const post = data.items[0].fields;

        // 3. Đổ dữ liệu lên giao diện
        document.title = post.title;
        document.getElementById('tinTuc-title').innerText = post.title;
        document.getElementById('tinTuc-date').innerText = 'Ngày đăng: ' + new Date(post.publishDate).toLocaleDateString('vi-VN');
        document.getElementById('tinTuc-content').innerHTML = post.content;

      } catch (error) {
        document.getElementById('tinTuc-title').innerText = 'Lỗi kết nối tới máy chủ!';
        console.error(error);
      }
    }

    loadPostDetail();
  </script>
</body>
</html>
