<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức & Khóa Tu | Chùa Vĩnh Hưng</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        buddhist: { gold: '#d4af37', lightgold: '#f3e5ab', maroon: '#6b2024', dark: '#3d1c1d' }
                    },
                    fontFamily: { heading: ['Lora', 'serif'], body: ['Nunito Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Nunito Sans', sans-serif; background-color: #faf8f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', serif; }
        .hero-sub {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/quanam.jpg');
            background-size: cover; background-position: center;
        }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        /* Animation cho navbar khi scroll */
        .scrolled-nav {
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .scrolled-nav .nav-link {
            color: #6b2024;
        }
        .scrolled-nav .logo-text {
            color: #6b2024;
        }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <div id="header-container"></div>

    <section class="hero-sub h-[40vh] mt-0 flex items-center justify-center relative">
        <div class="text-center px-4 z-10 text-white mt-10">
            <h1 class="text-4xl md:text-5xl font-heading font-bold mb-4 drop-shadow-lg">Thư Viện Video Bài Giảng</h1>
            <p class="text-lg text-gray-200 font-light">Lắng nghe những chia sẻ, pháp thoại từ chư Tôn đức để tìm thấy sự an lạc.</p>
        </div>
    </section>

    <section class="py-16">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-buddhist-gold"></i>
                    <p class="mt-4 text-gray-500">Đang tải danh sách video...</p>
                </div>
            </div>
        </div>
    </section>
    <div id="footer-container"></div>

    <script src="js/main.js"></script>
    <script>
        const DB_URL = 'https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app/videos.json';
        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideos() {
            const grid = document.getElementById('video-grid');
            try {
                const response = await fetch(DB_URL);
                const data = await response.json();
                
                grid.innerHTML = '';
                
                if (!data) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10">Hiện chưa có video nào được đăng.</div>';
                    return;
                }

                // Lọc qua các video và chỉ lấy những video không bị ẩn (hidden !== true và hidden !== 'true')
                const activeVideos = Object.keys(data).filter(key => {
                    const v = data[key];
                    return v.hidden !== true && v.hidden !== 'true';
                });

                if (activeVideos.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10">Hiện chưa có video nào được hiển thị.</div>';
                    return;
                }

                activeVideos.forEach(key => {
                    const v = data[key];
                    const vId = getYouTubeID(v.url);
                    
                    if (vId) {
                        const card = document.createElement('div');
                        card.className = "bg-white rounded-lg overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300";
                        card.innerHTML = `
                            <a href="${v.url}" target="_blank" class="block relative group overflow-hidden">
                                <!-- Đổi mqdefault.jpg thành maxresdefault.jpg để lấy ảnh nét nhất -->
                                <img src="https://img.youtube.com/vi/${vId}/maxresdefault.jpg" alt="${v.title}" class="w-full aspect-video object-cover transition duration-500 group-hover:scale-110">
                                <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition">
                                    <i class="fa-solid fa-play text-white text-4xl opacity-80"></i>
                                </div>
                            </a>
                            <div class="p-6">
                                <h3 class="text-lg font-heading font-bold mb-3 hover:text-buddhist-maroon transition cursor-pointer line-clamp-2">${v.title}</h3>
                                <a href="${v.url}" target="_blank" class="text-buddhist-gold font-semibold hover:text-buddhist-maroon transition">Xem trên YouTube &rarr;</a>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-600">Không thể tải dữ liệu video.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchVideos);
    </script>
</body>
</html>
