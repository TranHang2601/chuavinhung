<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Quản Trị - Chùa Vĩnh Hưng</title>
</head>
<body>
  <!-- Thư viện Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- Khai báo cấu hình trực tiếp để tránh lỗi không tìm thấy file config.yml -->
  <script>
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "TranHang2601/chuavinhung",
          branch: "main",
          base_url: "https://decap-oauth.chuavinhhung.workers.dev",
          client_id: "Ov23liixP8ONSVZfah6H"
        },
        media_folder: "static/images/uploads",
        public_folder: "/images/uploads",
        collections: [
          {
            name: "posts",
            label: "Bài viết & Tin tức",
            folder: "content/posts",
            create: true,
            slug: "{{slug}}",
            fields: [
              {label: "Tiêu đề", name: "title", widget: "string"},
              {label: "Ngày đăng", name: "date", widget: "datetime"},
              {label: "Hình ảnh", name: "image", widget: "image", required: false},
              {label: "Nội dung", name: "body", widget: "markdown"}
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
