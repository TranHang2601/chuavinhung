<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video & Pháp Thoại | Chùa Vĩnh Hưng</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="js/maintenance-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        buddhist: { gold: '#d4af37', lightgold: '#f3e5ab', maroon: '#6b2024', dark: '#3d1c1d' }
                    },
                    fontFamily: { heading: ['Lora', 'serif'], body: ['Nunito Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Nunito Sans', sans-serif; background-color: #faf8f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', serif; }
        .hero-sub {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/quanam.jpg');
            background-size: cover; background-position: center;
        }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Hiệu ứng nút Play phát sáng màu trắng giống trang chủ */
        .play-btn-glow {
            transition: all 0.3s ease;
        }
        .group:hover .play-btn-glow {
            background-color: #ffffff !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9), 0 0 60px rgba(212, 175, 55, 0.9), 0 0 90px rgba(255, 255, 255, 0.6);
            transform: scale(1.15);
            color: #6b2024 !important;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <div id="header-container"></div>

    <section class="hero-sub h-[40vh] mt-0 flex items-center justify-center relative">
        <div class="text-center px-4 z-10 text-white mt-10">
            <h1 class="text-4xl md:text-5xl font-heading font-bold mb-4 drop-shadow-lg">Thư Viện Video Bài Giảng</h1>
            <p class="text-lg text-gray-200 font-light">Lắng nghe những chia sẻ, pháp thoại từ chư Tôn đức để tìm thấy sự an lạc.</p>
        </div>
    </section>

    <section class="py-16 flex-grow">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-buddhist-gold"></i>
                    <p class="mt-4 text-gray-500">Đang tải danh sách video...</p>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="js/main.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function getYouTubeID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideos() {
            const grid = document.getElementById('video-grid');
            try {
                database.ref('videos').on('value', (snapshot) => {
                    const data = snapshot.val();
                    grid.innerHTML = '';
                    
                    if (!data) {
                        grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Hiện chưa có video nào được đăng.</div>';
                        return;
                    }

                    // Sắp xếp video theo thời gian created_at giảm dần (video mới nhất lên đầu tiên)
                    const sortedKeys = Object.keys(data).sort((a, b) => {
                        const timeA = data[a].created_at || 0;
                        const timeB = data[b].created_at || 0;
                        return timeB - timeA;
                    });

                    const activeVideos = sortedKeys.filter(key => {
                        const v = data[key];
                        return v.hidden !== true && v.hidden !== 'true';
                    });

                    if (activeVideos.length === 0) {
                        grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-500">Hiện chưa có video nào được hiển thị.</div>';
                        return;
                    }

                    activeVideos.forEach(key => {
                        const v = data[key];
                        const vId = getYouTubeID(v.url);
                        const dateStr = v.created_at ? new Date(v.created_at).toLocaleDateString('vi-VN') : '';
                        
                        if (vId) {
                            const card = document.createElement('div');
                            card.className = "bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition duration-300 border border-amber-100 flex flex-col justify-between group";
                            card.innerHTML = `
                                <a href="${v.url}" target="_blank" class="block relative group overflow-hidden aspect-video bg-gray-900">
                                    <img src="${v.thumbnail || `https://img.youtube.com/vi/${vId}/maxresdefault.jpg`}" alt="${v.title || ''}" class="w-full h-full object-cover brightness-105 contrast-105 transition duration-500 group-hover:scale-105 group-hover:brightness-110" onerror="this.src='https://img.youtube.com/vi/${vId}/hqdefault.jpg'">
                                    <div class="absolute inset-0 flex items-center justify-center bg-black/30 group-hover:bg-opacity-20 transition">
                                        <div class="w-14 h-14 rounded-full bg-buddhist-gold text-buddhist-dark flex items-center justify-center text-xl shadow-lg play-btn-glow">
                                            <i class="fa-solid fa-play ml-1"></i>
                                        </div>
                                    </div>
                                </a>
                                <div class="p-6 flex-1 flex flex-col justify-between space-y-3">
                                    <div>
                                        <div class="text-xs font-semibold text-buddhist-gold uppercase tracking-wider mb-2 flex items-center">
                                            <i class="fa-regular fa-calendar-days mr-1.5"></i> ${dateStr}
                                        </div>
                                        <h3 class="text-lg font-heading font-bold text-gray-900 hover:text-buddhist-maroon transition line-clamp-2">
                                            <a href="${v.url}" target="_blank">${v.title || ''}</a>
                                        </h3>
                                    </div>
                                    <div class="pt-3 border-t border-gray-100">
                                        <a href="${v.url}" target="_blank" class="text-xs font-bold text-buddhist-maroon hover:text-buddhist-gold uppercase tracking-wider flex items-center gap-1">
                                            Xem trên YouTube <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                        </a>
                                    </div>
                                </div>
                            `;
                            grid.appendChild(card);
                        }
                    });
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-600">Không thể tải dữ liệu video.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchVideos);
    </script>
</body>
</html>
