<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức & Khóa Tu | Chùa Vĩnh Hưng</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        buddhist: { gold: '#d4af37', lightgold: '#f3e5ab', maroon: '#6b2024', dark: '#3d1c1d' }
                    },
                    fontFamily: { heading: ['Lora', 'serif'], body: ['Nunito Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Nunito Sans', sans-serif; background-color: #faf8f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', serif; }
        .hero-sub {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/quanam.jpg');
            background-size: cover; background-position: center;
        }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header -->
    <header id="header" class="fixed w-full top-0 z-50 transition-all duration-300 text-white bg-black bg-opacity-40">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                    <div class="w-16 h-16 sm:w-14 sm:h-14 rounded-full bg-white p-1 shadow-md flex-shrink-0 border-2 border-yellow-600 overflow-hidden flex items-center justify-center">
                        <img src="images/logo.png" alt="Logo Chùa Vĩnh Hưng" onerror="this.src='https://placehold.co/100x100/3d1c1d/d4af37?text=CVH'">
                    </div>
                    <span class="logo-text text-2xl font-heading font-bold tracking-wider transition-colors duration-300 ml-4">
                        CHÙA VĨNH HƯNG
                    </span>
                </div>
                
                <nav class="hidden md:flex space-x-8">
                    <a href="index.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-buddhist-gold transition-colors">Trang Chủ</a>
                    <a href="tin-tuc.html" class="nav-link text-sm font-semibold uppercase tracking-wider text-buddhist-gold transition-colors border-b-2 border-buddhist-gold">Tin Tức & Khóa Tu</a>
                    <a href="lien-he.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-buddhist-gold transition-colors">Liên Hệ</a>
                    <a href="admin/admin-tin-tuc.html" class="nav-link text-sm font-semibold uppercase tracking-wider hover:text-buddhist-gold transition-colors">Quản Trị</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero-sub h-[40vh] mt-0 flex items-center justify-center relative">
        <div class="text-center px-4 z-10 text-white mt-10">
            <h1 class="text-4xl md:text-5xl font-heading font-bold mb-4 drop-shadow-lg">Tin Tức & Phật Sự</h1>
            <p class="text-lg text-gray-200 font-light">Cập nhật lịch hoạt động, khóa tu và các chuyến từ thiện mới nhất.</p>
        </div>
    </section>

    <section class="py-16">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-buddhist-gold"></i>
                    <p class="mt-4 text-gray-500">Đang tải tin tức...</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        const FIREBASE_NEWS_URL = 'https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app/news.json';

        async function fetchNews() {
            const grid = document.getElementById('news-grid');
            try {
                const response = await fetch('https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app/news.json');
                const data = await response.json();
                
                grid.innerHTML = '';
                
                if (!data) {
                    grid.innerHTML = '<div class="col-span-full text-center py-10">Chưa có bài viết nào.</div>';
                    return;
                }

                const newsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                newsArray.sort((a, b) => b.created_at - a.created_at);

                newsArray.forEach(post => {
                    const article = document.createElement('article');
                    article.className = "bg-white rounded-lg overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300";
                    
                    // Logic xử lý ảnh: Nếu không có ảnh hoặc link ảnh trống, dùng ảnh mặc định.
                    // Nếu link ảnh bắt đầu bằng "images/", nó sẽ tìm trong folder local của bạn.
                    // Thay thế dòng 111 hiện tại bằng dòng này:
                    const imgSrc = (post.image && post.image.trim() !== "") ? post.image : 'https://placehold.co/600x400/3d1c1d/d4af37?text=ChuaVinhHung';

                    article.innerHTML = `
                        <img src="${imgSrc}" class="w-full h-56 object-cover" onerror="this.src='https://placehold.co/600x400/3d1c1d/d4af37?text=ChuaVinhHung'">
                        <div class="p-6">
                            <div class="text-sm text-gray-500 mb-2">${post.created_at ? new Date(post.created_at).toLocaleDateString('vi-VN') : ''}</div>
                            <h3 class="text-xl font-heading font-bold mb-3 hover:text-buddhist-maroon transition cursor-pointer">${post.title}</h3>
                            <p class="text-gray-600 mb-4 line-clamp-3">${post.content.replace(/<[^>]*>?/gm, '')}</p>
                            <a href="#" class="text-buddhist-gold font-semibold hover:text-buddhist-maroon transition">Đọc tiếp &rarr;</a>
                        </div>
                    `;
                    grid.appendChild(article);
                });
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-600">Không thể tải dữ liệu.</div>';
            }
        }

        window.onload = fetchNews;
    </script>
</body>
</html>
