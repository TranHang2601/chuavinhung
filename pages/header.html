<header id="header" class="fixed w-full top-0 z-50 transition-all duration-300 text-white bg-black bg-opacity-40">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Logo và Tên Chùa -->
            <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-white p-1 shadow-md flex-shrink-0 border-2 border-amber-400 overflow-hidden flex items-center justify-center">
                    <img src="images/logo.png" alt="Logo Chùa Vĩnh Hưng" onerror="this.src='https://placehold.co/100x100/e11d48/ffffff?text=VH'">
                </div>
                <span id="logo-text" class="logo-text text-xl sm:text-2xl font-heading font-bold tracking-wider transition-colors duration-300 ml-3.5 text-amber-200">
                    CHÙA VĨNH HƯNG
                </span>
            </div>
            
            <!-- Desktop Menu (Mặc định + Tải động Firebase có lọc mục ẩn) -->
            <nav id="desktop-menu-nav" class="hidden md:flex space-x-6 lg:space-x-8 items-center">
                <a href="index.html" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-bold pb-1 border-b-2 text-amber-400 border-amber-400">Trang Chủ</a>
                <a href="pages/gioi-thieu.html" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-semibold text-white hover:text-amber-300">Giới Thiệu</a>
                <a href="pages/tin-tuc.html" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-semibold text-white hover:text-amber-300">Tin Tức & Khóa Tu</a>
                <a href="pages/video.html" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-semibold text-white hover:text-amber-300">Giảng Pháp</a>
                <a href="pages/lien-he.html" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-semibold text-white hover:text-amber-300">Liên Hệ</a>
            </nav>

            <!-- Nút Bật/Tắt Mobile Menu -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="text-amber-200 hover:text-white focus:outline-none p-2 rounded-xl bg-white/10 border border-amber-400/30 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Container Menu trên Thiết Bị Di Động -->
    <div id="mobile-menu" class="hidden md:hidden bg-white/95 backdrop-blur-md shadow-2xl absolute w-full left-0 top-20 border-t border-amber-200 text-slate-800">
        <div id="mobile-menu-container" class="px-4 py-4 space-y-2">
            <a href="index.html" class="block px-4 py-2.5 text-sm rounded-xl transition bg-amber-50 text-amber-800 font-bold">Trang Chủ</a>
            <a href="pages/gioi-thieu.html" class="block px-4 py-2.5 text-sm rounded-xl transition text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-semibold">Giới Thiệu</a>
            <a href="pages/tin-tuc.html" class="block px-4 py-2.5 text-sm rounded-xl transition text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-semibold">Tin Tức & Khóa Tu</a>
            <a href="pages/video.html" class="block px-4 py-2.5 text-sm rounded-xl transition text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-semibold">Giảng Pháp</a>
            <a href="pages/lien-he.html" class="block px-4 py-2.5 text-sm rounded-xl transition text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-semibold">Liên Hệ</a>
        </div>
    </div>
</header>

<script>
    function toggleMobileMenu() {
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenu) {
            mobileMenu.classList.toggle('hidden');
        }
    }

    async function loadHeaderDynamicMenus() {
        const desktopNav = document.getElementById('desktop-menu-nav');
        const mobileContainer = document.getElementById('mobile-menu-container');

        if (!desktopNav || !mobileContainer) return;

        try {
            let menuData = null;

            if (typeof firebase !== 'undefined' && firebase.database) {
                const snapshot = await firebase.database().ref('menus').once('value');
                menuData = snapshot.val();
            } else {
                const response = await fetch('https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app/menus.json');
                if (response.ok) {
                    menuData = await response.json();
                }
            }

            if (!menuData || Object.keys(menuData).length === 0) {
                updateNavColorsOnScroll();
                return;
            }

            const sortedKeys = Object.keys(menuData).sort((a, b) => (menuData[a].order || 0) - (menuData[b].order || 0));
            
            let desktopHtml = '';
            let mobileHtml = '';
            let rawPath = window.location.pathname.split('/').pop() || 'index.html';
            const currentPath = rawPath.split('?')[0];
            const isScrolled = window.scrollY > 50;

            sortedKeys.forEach(key => {
                const item = menuData[key];
                
                // BỎ QUA NẾU MỤC MENU ĐANG ĐƯỢC ĐẶT TRẠNG THÁI ẨN TỪ TRANG ADMIN
                if (item.hidden === true) return;

                const title = item.title || '';
                const url = item.url || '#';
                const isActive = currentPath === url || (currentPath === '' && url === 'index.html');

                const desktopClass = isActive 
                    ? (isScrolled ? 'text-amber-700 border-b-2 border-amber-600 pb-1 font-bold' : 'text-amber-400 border-b-2 border-amber-400 pb-1 font-bold')
                    : (isScrolled ? 'text-slate-800 hover:text-amber-700 font-semibold' : 'text-white hover:text-amber-300 font-semibold');

                const mobileClass = isActive 
                    ? 'bg-amber-50 text-amber-800 font-bold' 
                    : 'text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-semibold';

                desktopHtml += `<a href="${url}" data-url="${url}" data-active="${isActive}" class="nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors ${desktopClass}">${title}</a>`;
                mobileHtml += `<a href="${url}" class="block px-4 py-2.5 text-sm rounded-xl transition ${mobileClass}">${title}</a>`;
            });

            desktopNav.innerHTML = desktopHtml;
            mobileContainer.innerHTML = mobileHtml;

            updateNavColorsOnScroll();
        } catch (err) {
            console.warn("Giữ nguyên menu mặc định:", err);
            updateNavColorsOnScroll();
        }
    }

    function updateNavColorsOnScroll() {
        const isScrolled = window.scrollY > 50;
        let rawPath = window.location.pathname.split('/').pop() || 'index.html';
        const currentPath = rawPath.split('?')[0];
        const navLinks = document.querySelectorAll('#desktop-menu-nav .nav-link');

        navLinks.forEach(link => {
            const href = (link.getAttribute('href') || link.getAttribute('data-url') || '').split('/').pop().split('?')[0];
            const isActive = link.getAttribute('data-active') === 'true' || href === currentPath || (currentPath === '' && href === 'index.html');
            if (isActive) {
                link.setAttribute('data-active', 'true');
                link.className = `nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-bold pb-1 border-b-2 ${
                    isScrolled ? 'text-amber-700 border-amber-600' : 'text-amber-400 border-amber-400'
                }`;
            } else {
                link.setAttribute('data-active', 'false');
                link.className = `nav-link text-xs lg:text-sm uppercase tracking-wider transition-colors font-semibold ${
                    isScrolled ? 'text-slate-800 hover:text-amber-700' : 'text-white hover:text-amber-300'
                }`;
            }
        });
    }

    function setupHeaderScrollEffect() {
        const header = document.getElementById('header');
        const logoText = document.getElementById('logo-text');
        const mobileBtn = document.getElementById('mobile-menu-btn');

        if (!header) return;

        const handleScroll = () => {
            if (window.scrollY > 50) {
                header.classList.remove('bg-black', 'bg-opacity-40', 'text-white');
                header.classList.add('bg-white', 'text-slate-900', 'shadow-md', 'border-b', 'border-slate-200');
                if (logoText) {
                    logoText.classList.remove('text-amber-200');
                    logoText.classList.add('text-amber-800');
                }
                if (mobileBtn) {
                    mobileBtn.classList.remove('text-amber-200', 'bg-white/10', 'border-amber-400/30');
                    mobileBtn.classList.add('text-amber-900', 'bg-slate-100', 'border-slate-300');
                }
            } else {
                header.classList.add('bg-black', 'bg-opacity-40', 'text-white');
                header.classList.remove('bg-white', 'text-slate-900', 'shadow-md', 'border-b', 'border-slate-200');
                if (logoText) {
                    logoText.classList.add('text-amber-200');
                    logoText.classList.remove('text-amber-800');
                }
                if (mobileBtn) {
                    mobileBtn.classList.add('text-amber-200', 'bg-white/10', 'border-amber-400/30');
                    mobileBtn.classList.remove('text-amber-900', 'bg-slate-100', 'border-slate-300');
                }
            }
            updateNavColorsOnScroll();
        };

        window.removeEventListener('scroll', handleScroll);
        window.addEventListener('scroll', handleScroll);
        handleScroll();
    }

    function initHeader() {
        loadHeaderDynamicMenus();
        setupHeaderScrollEffect();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initHeader);
    } else {
        initHeader();
    }

    window.initHeader = initHeader;
</script>
