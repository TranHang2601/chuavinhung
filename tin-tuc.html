<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức & Thông Báo | Chùa Vĩnh Hưng</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        buddhist: { gold: '#d4af37', lightgold: '#f3e5ab', maroon: '#6b2024', dark: '#3d1c1d' }
                    },
                    fontFamily: { heading: ['Lora', 'serif'], body: ['Nunito Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Nunito Sans', sans-serif; background-color: #faf8f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Lora', serif; }
        .hero-sub {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('images/quanam.jpg');
            background-size: cover; background-position: center;
        }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Thẻ header động -->
    <div id="header-container"></div>

    <section class="hero-sub h-[40vh] mt-0 flex items-center justify-center relative">
        <div class="text-center px-4 z-10 text-white mt-10">
            <h1 class="text-4xl md:text-5xl font-heading font-bold mb-4 drop-shadow-lg">Tin Tức & Thông Báo</h1>
            <p class="text-lg text-gray-200 font-light">Cập nhật lịch khóa tu, ngày lễ phật đản và các Phật sự mới nhất.</p>
        </div>
    </section>

    <!-- THANH ĐIỀU HƯỚNG TAB & MENU XỔ XUỐNG THÔNG BÁO -->
    <section class="bg-white border-b border-gray-200 shadow-sm sticky top-20 z-40">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-6">
                <!-- Tab Tất Cả Tin Tức -->
                <button onclick="filterCategory('all')" id="tab-all" class="px-6 py-2.5 rounded-full font-bold text-sm uppercase tracking-wider transition bg-buddhist-maroon text-white shadow-md">
                    <i class="fa-solid fa-newspaper mr-1.5"></i> Tất Cả Tin Tức
                </button>

                <!-- Nhóm Tab Thông Báo có menu xổ xuống -->
                <div class="relative group pb-2 -mb-2">
                    <button id="dropdown-toggle-btn" class="px-6 py-2.5 rounded-full font-bold text-sm uppercase tracking-wider transition bg-gray-100 hover:bg-gray-200 text-gray-800 flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-bell text-buddhist-gold"></i> Thông Báo & Khóa Tu <i class="fa-solid fa-chevron-down text-xs ml-1"></i>
                    </button>
                    
                    <!-- Menu xổ xuống (Dropdown) -->
                    <div id="notification-dropdown" class="absolute left-0 top-full pt-1 w-72 hidden group-hover:block z-50">
                        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 py-2">
                            <button onclick="filterCategory('thong-bao')" class="w-full text-left px-5 py-3 text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:text-buddhist-maroon transition flex items-center gap-2.5">
                                <i class="fa-solid fa-bullhorn text-buddhist-gold"></i> Tất Cả Thông Báo
                            </button>
                            <button onclick="filterCategory('bat-quan-trai')" class="w-full text-left px-5 py-3 text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:text-buddhist-maroon transition flex items-center gap-2.5">
                                <i class="fa-solid fa-spa text-buddhist-gold"></i> Khóa tu Bát Quan Trai
                            </button>
                            <button onclick="filterCategory('tuoi-tre-quy-y')" class="w-full text-left px-5 py-3 text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:text-buddhist-maroon transition flex items-center gap-2.5">
                                <i class="fa-solid fa-child-reaching text-buddhist-gold"></i> Khóa tu Tuổi trẻ Quy Y
                            </button>
                            <button onclick="filterCategory('quy-y')" class="w-full text-left px-5 py-3 text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:text-buddhist-maroon transition flex items-center gap-2.5">
                                <i class="fa-solid fa-hands-praying text-buddhist-gold"></i> Quy y Tam Bảo
                            </button>
                            <button onclick="filterCategory('ngay-le')" class="w-full text-left px-5 py-3 text-sm font-semibold text-gray-700 hover:bg-rose-50 hover:text-buddhist-maroon transition flex items-center gap-2.5">
                                <i class="fa-solid fa-calendar-star text-buddhist-gold"></i> Lễ khác / Ngày lễ chùa
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-16">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div id="active-category-title" class="mb-8 text-xl font-heading font-bold text-buddhist-maroon border-l-4 border-buddhist-gold pl-3">
                Hiển thị: Tất cả tin tức chung
            </div>
            
            <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full text-center py-20">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-buddhist-gold"></i>
                    <p class="mt-4 text-gray-500">Đang tải tin tức...</p>
                </div>
            </div>
        </div>
    </section>
    
    <div id="footer-container"></div>
    
    <!-- Script xử lý tải dữ liệu và phân tách chuẩn danh mục / tag -->
    <script>
        const firebaseConfig = {
            databaseURL: "https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        let allNewsCache = {};
        let currentCategory = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            fetchNewsData();
        });

        function createSlug(str) {
            if (!str) return '';
            str = str.toLowerCase();
            str = str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            str = str.replace(/[đĐ]/g, 'd');
            str = str.replace(/([^0-9a-z-\s])/g, '');
            str = str.replace(/(\s+)/g, '-');
            str = str.replace(/-+/g, '-');
            str = str.replace(/^-+|-+$/g, '');
            return str;
        }

        async function fetchNewsData() {
            const grid = document.getElementById('news-grid');
            try {
                const response = await fetch('https://chuavinhhung-web-default-rtdb.asia-southeast1.firebasedatabase.app/news.json');
                const data = await response.json();
                
                if (!data) {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">Chưa có bài viết nào được đăng tải.</div>';
                    return;
                }

                allNewsCache = data;
                renderNewsList(currentCategory);

            } catch (error) {
                console.error("Lỗi tải tin tức:", error);
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Không thể tải dữ liệu tin tức. Vui lòng thử lại sau.</div>';
            }
        }

        function filterCategory(category) {
            currentCategory = category;
            
            // Cập nhật trạng thái active cho nút Tất Cả Tin Tức
            const tabAll = document.getElementById('tab-all');
            if (tabAll) {
                tabAll.className = category === 'all' 
                    ? "px-6 py-2.5 rounded-full font-bold text-sm uppercase tracking-wider transition bg-buddhist-maroon text-white shadow-md"
                    : "px-6 py-2.5 rounded-full font-bold text-sm uppercase tracking-wider transition bg-gray-100 hover:bg-gray-200 text-gray-800 shadow-sm";
            }

            const titleEl = document.getElementById('active-category-title');
            if (category === 'all') titleEl.textContent = "Hiển thị: Tất cả tin tức chung";
            else if (category === 'thong-bao') titleEl.textContent = "Hiển thị: Tất cả Thông Báo";
            else if (category === 'bat-quan-trai') titleEl.textContent = "Hiển thị: Khóa tu Bát Quan Trai";
            else if (category === 'tuoi-tre-quy-y') titleEl.textContent = "Hiển thị: Khóa tu Tuổi trẻ Quy Y";
            else if (category === 'quy-y') titleEl.textContent = "Hiển thị: Quy y Tam Bảo";
            else if (category === 'ngay-le') titleEl.textContent = "Hiển thị: Lễ khác / Ngày lễ chùa";

            renderNewsList(category);
        }

        function renderNewsList(category) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            const keys = Object.keys(allNewsCache).reverse();
            let visibleCount = 0;

            keys.forEach(key => {
                const post = allNewsCache[key];
                
                // Bỏ qua bài viết đang bị ẩn
                if (post.hidden === true) return; 

                // Lọc phân tách chính xác theo category và tag từ cơ sở dữ liệu
                if (category === 'all') {
                    // Tab "Tất Cả Tin Tức" chỉ hiển thị các bài thuộc danh mục 'tin-tuc' (loại bỏ thông báo)
                    if (post.category === 'thong-bao') return;
                } else if (category === 'thong-bao') {
                    // Tab "Tất Cả Thông Báo" hiển thị tất cả các bài có category là thông báo
                    if (post.category !== 'thong-bao') return;
                } else {
                    // Các tab tag cụ thể (bat-quan-trai, tuoi-tre-quy-y, quy-y, ngay-le)
                    if (post.category !== 'thong-bao' || post.tag !== category) return;
                }

                visibleCount++;
                const dateStr = post.created_at ? new Date(post.created_at).toLocaleDateString('vi-VN') : '';
                const imgSrc = post.image || 'https://placehold.co/600x400/3d1c1d/d4af37?text=Chua+Vinh+Hung';
                
                let rawContent = post.content || '';
                rawContent = rawContent.replace(/<iframe[\s\S]*?<\/iframe>/gi, '');
                rawContent = rawContent.replace(/<[^>]*>?/gm, '');
                rawContent = rawContent.replace(/:::[a-z]*[\s\S]*?:::/gi, '');
                rawContent = rawContent.replace(/[#*`_>]/g, '').trim();

                const postSlug = post.slug ? post.slug : (post.title ? createSlug(post.title) : key);
                const tagBadge = post.tag ? `<span class="inline-block px-2.5 py-0.5 bg-rose-50 text-rose-700 rounded-md text-[10px] font-bold mb-2 uppercase"><i class="fa-solid fa-tag mr-1"></i>${post.tag}</span>` : '';

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-md border border-amber-100 flex flex-col hover:shadow-xl transition duration-300";
                card.innerHTML = `
                    <div class="h-48 overflow-hidden relative">
                        <img src="${imgSrc}" alt="${post.title || ''}" class="w-full h-full object-cover hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/3d1c1d/d4af37?text=Chua+Vinh+Hung'">
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold text-buddhist-gold uppercase tracking-wider"><i class="fa-regular fa-calendar-days mr-1"></i> ${dateStr}</span>
                                ${tagBadge}
                            </div>
                            <h3 class="text-xl font-heading font-bold text-gray-900 mt-2 hover:text-buddhist-maroon transition">
                                <a href="chi-tiet-tin-tuc.html?slug=${postSlug}">${post.title || ''}</a>
                            </h3>
                            <p class="text-gray-600 text-sm mt-2 line-clamp-3">${rawContent}</p>
                        </div>
                        <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                            <a href="chi-tiet-tin-tuc.html?slug=${postSlug}" class="text-xs font-bold text-buddhist-maroon hover:text-buddhist-gold uppercase tracking-wider flex items-center gap-1">
                                Xem chi tiết <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (visibleCount === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">Chưa có bài viết nào thuộc danh mục này.</div>';
            }
        }
    </script>
    
    <script src="js/main.js"></script>

</body>
</html>
